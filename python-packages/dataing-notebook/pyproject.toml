[project]
name = "dataing-notebook"
version = "1.23.5"
description = "Dataing notebook extension with IPython magics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Dataing", email = "hello@dataing.io" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
keywords = ["jupyter", "notebook", "data-quality", "investigation"]

dependencies = [
    "dataing-sdk>=0.1.0",
    "ipython>=8.0.0",
    "tornado>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
rich = [
    "rich>=13.0.0",
]
server = [
    "jupyter-server>=2.0.0",
]
keyring = [
    "keyring>=24.0.0",
]
graph = [
    "ipycytoscape>=1.3.0",
    "ipywidgets>=8.0.0",
]

[project.entry-points."jupyter_server.extensions"]
dataing_notebook = "dataing_notebook.serverextension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataing_notebook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "D", "B", "UP"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
