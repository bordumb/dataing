name: Test Publish

on:
  pull_request:
    paths:
      - "python-packages/dataing-cli/**"
      - "python-packages/dataing-sdk/**"
      - "python-packages/dataing-notebook/**"
      - "python-packages/dataing-meta/**"

jobs:
  build-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - { dir: "python-packages/dataing-cli", name: "dataing-cli" }
          - { dir: "python-packages/dataing-sdk", name: "dataing-sdk" }
          - { dir: "python-packages/dataing-notebook", name: "dataing-notebook" }
          - { dir: "python-packages/dataing-meta", name: "dataing" }

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        working-directory: ${{ matrix.package.dir }}
        run: python -m build

      - name: Check package with twine
        run: twine check ${{ matrix.package.dir }}/dist/*
