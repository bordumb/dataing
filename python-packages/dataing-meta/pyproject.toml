[project]
name = "dataing"
version = "1.21.0"
description = "Dataing - Autonomous Data Quality Investigation (meta-package)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "dataing team" }]
keywords = ["data-quality", "observability", "llm", "investigation", "anomaly-detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
cli = ["dataing-cli>=0.1.0"]
sdk = ["dataing-sdk>=0.1.0"]
notebook = ["dataing-notebook>=0.1.0"]
all = [
    "dataing-cli>=0.1.0",
    "dataing-sdk>=0.1.0",
    "dataing-notebook>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/bordumb/dataing"
Documentation = "https://github.com/bordumb/dataing#readme"
Repository = "https://github.com/bordumb/dataing"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataing_meta"]
