version: '3.8'

services:
  # =============================================================================
  # Observability Stack
  # =============================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./demo/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.54
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "14268:14268" # Jaeger HTTP collector
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:16686"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =============================================================================
  # Core Services
  # =============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: dataing_demo
      POSTGRES_USER: dataing
      POSTGRES_PASSWORD: dataing
    volumes:
      - demo-pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataing -d dataing_demo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATADR_DEMO_MODE: "true"
      DATABASE_URL: postgresql://dataing:dataing@postgres:5432/dataing_demo
      APP_DATABASE_URL: postgresql://dataing:dataing@postgres:5432/dataing_demo
      DATADR_FIXTURE_PATH: /app/fixtures/null_spike
      DATADR_ENCRYPTION_KEY: ${DATADR_ENCRYPTION_KEY:-fj_HDi4E6H02W11I5cJtMB_u7HoUrc8AMN6_L0rqGcg=}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # OpenTelemetry Configuration
      OTEL_SERVICE_NAME: dataing-api
      OTEL_TRACES_ENABLED: "true"
      OTEL_METRICS_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - ./demo/fixtures:/app/fixtures:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    command: ["uvicorn", "dataing.entrypoints.api.app:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATADR_DEMO_MODE: "true"
      DATABASE_URL: postgresql://dataing:dataing@postgres:5432/dataing_demo
      APP_DATABASE_URL: postgresql://dataing:dataing@postgres:5432/dataing_demo
      DATADR_FIXTURE_PATH: /app/fixtures/null_spike
      DATADR_ENCRYPTION_KEY: ${DATADR_ENCRYPTION_KEY:-fj_HDi4E6H02W11I5cJtMB_u7HoUrc8AMN6_L0rqGcg=}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # OpenTelemetry Configuration
      OTEL_SERVICE_NAME: dataing-worker
      OTEL_TRACES_ENABLED: "true"
      OTEL_METRICS_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - ./demo/fixtures:/app/fixtures:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    command: ["python", "-m", "dataing.entrypoints.worker"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  demo-pgdata:
  redis_data:
