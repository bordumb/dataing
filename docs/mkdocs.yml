site_name: dataing
site_description: Autonomous Data Quality Investigation
site_url: https://dataing.dev

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [../dataing/src]
          options:
            docstring_style: google
            show_source: true
  - mermaid2

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - def_list
  - attr_list
  - md_in_html
  - footnotes
  - abbr
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Architecture: architecture.md
  - Concepts:
      - "How Investigations Work": concepts/investigations.md
      - "The Agent Engine (Maestro)": concepts/agent-workflows.md
      - "Safety & Guardrails": concepts/guardrails.md
  - Integrations:
      - Warehouses:
          - Snowflake: integrations/warehouses/snowflake.md
          - BigQuery: integrations/warehouses/bigquery.md
          - DuckDB: integrations/warehouses/duckdb.md
          - Postgres: integrations/warehouses/postgres.md
      - Lineage:
          - dbt: integrations/lineage/dbt.md
          - DataHub: integrations/lineage/datahub.md
      - Notifications:
          - Slack: integrations/notifications/slack.md
  - Security:
      - "Data Privacy": security/data-privacy.md
      - "RBAC & SSO": security/rbac.md
      - "Compliance": security/compliance.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bordumb/dataing

extra_css:
  - stylesheets/extra.css
