name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'bond/**'
      - 'maestro/**'
      - 'dataing/**'
      - 'dataing-ee/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bond/**'
      - 'maestro/**'
      - 'dataing/**'
      - 'dataing-ee/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/ci-backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run Ruff
        run: uv run ruff check bond/src maestro/src dataing/src dataing-ee/src

      - name: Run mypy
        run: uv run mypy bond/src maestro/src dataing/src dataing-ee/src

      # Run tests per-package to avoid conftest.py module conflicts
      - name: Run tests
        run: |
          uv run pytest maestro/tests --cov=maestro/src/maestro --cov-report=xml
          uv run pytest bond/tests --cov=bond/src/bond --cov-report=xml --cov-append
          uv run pytest dataing/tests --cov=dataing/src/dataing --cov-report=xml --cov-append
          uv run pytest dataing-ee/tests --cov=dataing-ee/src/dataing_ee --cov-report=xml --cov-append
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
