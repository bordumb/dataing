[project]
name = "dataing-cli"
version = "1.22.0"
description = "Command-line interface for Dataing - data quality investigation platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "dataing team" }]
keywords = ["cli", "data-quality", "investigation", "dataing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
dependencies = [
    "dataing-sdk>=0.1.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "keyring>=25.0.0",
    "jinja2>=3.1.0",
    "prompt_toolkit>=3.0.0",
    "pyyaml>=6.0.1",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
dataing = "dataing_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataing_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "../dataing/src", "../dataing-sdk/src"]
