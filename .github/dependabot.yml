version: 2
updates:
  # Python dependencies ("uv" updates uv.lock along with pyproject.toml)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # sentence-transformers 6 needs huggingface-hub 1.x. That forces pydantic-ai
      # back to 1.22, which has no pydantic_ai.embeddings (see #199).
      - dependency-name: "sentence-transformers"
        versions: [">=6"]
      # pydantic-ai 2 is a migration, not a bump: it fails 164 tests and moves
      # anthropic to 1.x (see #212). Upgrade it deliberately.
      - dependency-name: "pydantic-ai"
        versions: [">=2"]

  # Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/frontend/app"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "main"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"

  # Landing site dependencies
  - package-ecosystem: "npm"
    directory: "/frontend/landing"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "main"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
