name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/app/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # jsdom 30 needs Node 22 (on Node 20 its tests fail with
          # "webidl.util.markAsUncloneable is not a function")
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/app/pnpm-lock.yaml

      - name: Install dependencies
        run: cd frontend/app && pnpm install

      - name: Run lint
        run: cd frontend/app && pnpm lint

      - name: Run type check
        run: cd frontend/app && pnpm typecheck

      - name: Run tests
        run: cd frontend/app && pnpm test

      - name: Build
        run: cd frontend/app && pnpm build
